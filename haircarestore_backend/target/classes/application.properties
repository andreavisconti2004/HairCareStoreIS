#application.properties contiene le configurazioni di Spring.
#Spring legge automaticamente questo file all'avvio.

spring.application.name=haircarestore_backend

#Configurazione del Database MySQL.
#Stringa di connessione JDBC (Java Database Connectivity) necessaria per stabilire
#il canale di comunicazione con il database:
# - jdbc:mysql:// è il protocollo di comunicazione.
# - indirizzo dell'host locale (localhost) e la porta standard del DBMS (3306).
# - nome dello schema relazionale (hairCareStoreDB).
#Credenziali di autenticazione e autorizzazione per l'accesso allo schema relazionale.
# - username indica l'utente amministratore predefinito (root).
# - password contiene la chiave di accesso configurata sul DBMS.

spring.datasource.url=jdbc:mysql://localhost:3306/hairCareStoreDB
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configurazione dell'ORM JPA/HIBERNATE.
#database-platform: definisce il dialetto SQL specifico utilizzato dall'ORM Hibernate.
#Poiché ogni database relazionale implementa varianti e ottimizzazioni proprietarie dello standard SQL,
#questo parametro assicura che l'ORM generi a runtime stringhe SQL sintatticamente per MySQL.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#ddl-auto: come Hibernate gestisce lo schema relazione del Database all'avvio.
# - none-> non tocca nulla (lo schema è già esistente)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#show-sql: abilita l'intercettazione e il logging sul terminale di sviluppo di tutte le query SQL
#generate automaticamente dall'ORM a runtime.
#format_sql: lavora in combinazione con la proprietà precedente, costringendo Hibernate a formattare e indentare
#il codice SQL stampato nel terminale su più righe leggibili, secondo gli standard SQL.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=DEBUG