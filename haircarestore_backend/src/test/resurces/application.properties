# Protocollo, host, porta e schema relazionale specifico per il database di test usato da JUnit
spring.datasource.url=jdbc:mysql://localhost:3306/hairCareStoreTestDB
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Credenziali di default per l'istanza locale di XAMPP
spring.datasource.username=root
spring.datasource.password=

# Dialetto SQL specifico per garantire la compatibilità con MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Lo schema viene pre-inizializzato dallo script DB_Test_init.txt
spring.jpa.hibernate.ddl-auto=none

# Forzatura della nomenclatura esatta definita nelle classi Entity
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl